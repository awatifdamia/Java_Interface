<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataSet Java Lab</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap');

    :root {
      --bg-page: #f4f5f9;
      --card-white: #ffffff;
      --lime-card: #d9f99d;
      --pink-card: #fbcfe8;
      --blue-card: #bfdbfe;
      --purple-pill: #818cf8;
      --dark-btn: #1e293b;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-soft: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-dark);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      max-width: 540px;
      background-color: var(--card-white);
      border-radius: 32px;
      padding: 28px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Header */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.5px;
    }

    .badge-pill {
      background: #fef08a;
      color: #713f12;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    /* Select Dataset Domain Section */
    .section-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .dropdown-wrapper {
      position: relative;
    }

    .charmi-select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background-color: #f8fafc;
      border: 2px solid var(--border-soft);
      padding: 14px 40px 14px 16px;
      border-radius: 18px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-dark);
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
    }

    .charmi-select:hover, .charmi-select:focus {
      border-color: var(--dark-btn);
      background-color: #ffffff;
    }

    .dropdown-wrapper::after {
      content: "▼";
      font-size: 0.7rem;
      color: var(--text-muted);
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    /* Dynamic Inputs Panel */
    .form-panel {
      background: #f8fafc;
      border-radius: 22px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .inputs-grid {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .input-field-box {
      flex: 1;
      min-width: 140px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .charmi-input {
      width: 100%;
      background: #ffffff;
      border: 2px solid var(--border-soft);
      border-radius: 14px;
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .charmi-input:focus {
      border-color: var(--dark-btn);
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn-add {
      flex: 2;
      background: var(--dark-btn);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      padding: 12px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .btn-add:active { transform: scale(0.98); }

    .btn-reset {
      flex: 1;
      background: #e2e8f0;
      color: var(--text-dark);
      border: none;
      border-radius: 14px;
      padding: 12px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
    }

    /* Cards Stack */
    .cards-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .stat-card {
      border-radius: 24px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.03);
    }

    .card-lime { background-color: var(--lime-card); }
    .card-pink { background-color: var(--pink-card); }
    .card-blue { background-color: var(--blue-card); }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title-text {
      font-size: 0.85rem;
      font-weight: 800;
      color: #1e293b;
    }

    .card-subtext {
      font-size: 0.75rem;
      font-weight: 700;
      opacity: 0.75;
    }

    .card-val-text {
      font-size: 1.25rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: #0f172a;
    }
  </style>
</head>
<body>

<div class="app-shell">
  
  <div class="header-row">
    <div class="header-title">DATASET JAVA LAB</div>
    <div class="badge-pill">Measurable OOP</div>
  </div>

  <!-- Explicit Dataset Select Dropdown -->
  <div class="section-group">
    <div class="section-label">Select Dataset Domain</div>
    <div class="dropdown-wrapper">
      <select id="datasetSelect" class="charmi-select" onchange="renderForm()">
        <option value="bank">BankAccount Class (RM Balance)</option>
        <option value="coin">Coin Class (RM Value)</option>
        <option value="student">Student Class (Height in cm)</option>
      </select>
    </div>
  </div>

  <!-- Dynamic Input Form Panel -->
  <div class="form-panel">
    <div id="dynamicInputs" class="inputs-grid"></div>
    <div class="btn-row">
      <button class="btn-add" onclick="addItem()">+ Add Item</button>
      <button class="btn-reset" onclick="resetDataset()">Reset</button>
    </div>
  </div>

  <!-- Stacked Output Display Cards -->
  <div class="cards-stack">
    
    <div class="stat-card card-lime">
      <div class="card-info">
        <div class="card-title-text">Average Measure</div>
        <div id="avgLabel" class="card-subtext">Calculated Mean</div>
      </div>
      <div id="avgMeasure" class="card-val-text">RM 0.00</div>
    </div>

    <div class="stat-card card-pink">
      <div class="card-info">
        <div class="card-title-text">Highest Record</div>
        <div id="maxName" class="card-subtext">Top Item</div>
      </div>
      <div id="maxMeasure" class="card-val-text">RM 0.00</div>
    </div>

    <div class="stat-card card-blue">
      <div class="card-info">
        <div class="card-title-text">Total Elements</div>
        <div class="card-subtext">Items in Dataset</div>
      </div>
      <div id="itemCount" class="card-val-text">0</div>
    </div>

  </div>

</div>

<script>
let defaultData = {
  bank: [
    { balance: 0, name: "Account 1001" },
    { balance: 10000, name: "Account 1002" },
    { balance: 2000, name: "Account 1003" }
  ],
  coin: [
    { val: 0.25, name: "Quarter" },
    { val: 0.10, name: "Dime" },
    { val: 0.05, name: "Nickel" }
  ],
  student: [
    { height: 157.50, name: "Ali" },
    { height: 165.00, name: "Alex" },
    { height: 147.00, name: "Maria" }
  ]
};

let currentData = JSON.parse(JSON.stringify(defaultData));
let bankAccCounter = 1003;

function renderForm() {
  const type = document.getElementById("datasetSelect").value;
  const container = document.getElementById("dynamicInputs");

  if (type === "bank") {
    container.innerHTML = `
      <div class="input-field-box">
        <div class="input-label">Account Balance (RM)</div>
        <input type="number" id="bankVal" class="charmi-input" placeholder="e.g. 1500" value="1500">
      </div>
    `;
  } else if (type === "coin") {
    container.innerHTML = `
      <div class="input-field-box">
        <div class="input-label">Coin Name</div>
        <input type="text" id="coinName" class="charmi-input" placeholder="e.g. 50 Sen" value="50 Sen">
      </div>
      <div class="input-field-box">
        <div class="input-label">Coin Value (RM)</div>
        <input type="number" id="coinVal" class="charmi-input" step="0.01" placeholder="e.g. 0.50" value="0.50">
      </div>
    `;
  } else if (type === "student") {
    container.innerHTML = `
      <div class="input-field-box">
        <div class="input-label">Student Name</div>
        <input type="text" id="stName" class="charmi-input" placeholder="e.g. Ahmad" value="Ahmad">
      </div>
      <div class="input-field-box">
        <div class="input-label">Height (cm)</div>
        <input type="number" id="stH" class="charmi-input" step="0.1" placeholder="e.g. 172.5" value="172.5">
      </div>
    `;
  }
  calculateStats();
}

function addItem() {
  const type = document.getElementById("datasetSelect").value;

  if (type === "bank") {
    const val = parseFloat(document.getElementById("bankVal").value);
    if (!isNaN(val)) {
      bankAccCounter++;
      currentData.bank.push({ balance: val, name: "Account " + bankAccCounter });
    }
  } else if (type === "coin") {
    const name = document.getElementById("coinName").value;
    const val = parseFloat(document.getElementById("coinVal").value);
    if (name && !isNaN(val)) {
      currentData.coin.push({ val: val, name: name });
    }
  } else if (type === "student") {
    const name = document.getElementById("stName").value;
    const val = parseFloat(document.getElementById("stH").value);
    if (name && !isNaN(val)) {
      currentData.student.push({ height: val, name: name });
    }
  }

  calculateStats();
}

function resetDataset() {
  currentData = JSON.parse(JSON.stringify(defaultData));
  bankAccCounter = 1003;
  calculateStats();
}

function calculateStats() {
  const type = document.getElementById("datasetSelect").value;
  const list = currentData[type];
  
  document.getElementById("itemCount").textContent = list.length;

  if (list.length === 0) {
    document.getElementById("avgMeasure").textContent = "0.00";
    document.getElementById("maxMeasure").textContent = "0.00";
    document.getElementById("maxName").textContent = "None";
    return;
  }

  let sum = 0;
  let maxObj = list[0];

  if (type === "bank") {
    list.forEach(item => {
      sum += item.balance;
      if (item.balance > maxObj.balance) maxObj = item;
    });
    const avg = sum / list.length;
    document.getElementById("avgMeasure").textContent = "RM " + avg.toFixed(2);
    document.getElementById("avgLabel").textContent = "Average Balance";
    document.getElementById("maxMeasure").textContent = "RM " + maxObj.balance.toFixed(2);
    document.getElementById("maxName").textContent = maxObj.name;
  } else if (type === "coin") {
    list.forEach(item => {
      sum += item.val;
      if (item.val > maxObj.val) maxObj = item;
    });
    const avg = sum / list.length;
    document.getElementById("avgMeasure").textContent = "RM " + avg.toFixed(2);
    document.getElementById("avgLabel").textContent = "Average Coin Value";
    document.getElementById("maxMeasure").textContent = "RM " + maxObj.val.toFixed(2);
    document.getElementById("maxName").textContent = maxObj.name;
  } else if (type === "student") {
    list.forEach(item => {
      sum += item.height;
      if (item.height > maxObj.height) maxObj = item;
    });
    const avg = sum / list.length;
    document.getElementById("avgMeasure").textContent = avg.toFixed(2) + " cm";
    document.getElementById("avgLabel").textContent = "Average Height";
    document.getElementById("maxMeasure").textContent = maxObj.height.toFixed(2) + " cm";
    document.getElementById("maxName").textContent = maxObj.name + " (Tallest)";
  }
}

renderForm();
</script>

</body>
</html>
