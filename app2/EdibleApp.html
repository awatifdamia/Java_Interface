<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edible Food & Animals App</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@700&display=swap');

    :root {
      --bg-page: #f4f5f9;
      --card-white: #ffffff;
      --lime-card: #d9f99d;
      --pink-card: #fbcfe8;
      --blue-card: #bfdbfe;
      --dark-btn: #1e293b;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-soft: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-page);
      color: var(--text-dark);
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .app-shell {
      width: 100%;
      max-width: 540px;
      background-color: var(--card-white);
      border-radius: 32px;
      padding: 28px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .header-title-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .header-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.5px;
    }

    .header-sub {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .badge-pill {
      background: #dcfce7;
      color: #166534;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    /* Input Sections */
    .form-section {
      background: #f8fafc;
      border-radius: 22px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-dark);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-field-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .charmi-input {
      width: 100%;
      background: #ffffff;
      border: 2px solid var(--border-soft);
      border-radius: 14px;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .charmi-input:focus {
      border-color: var(--dark-btn);
    }

    /* Action Button */
    .btn-action {
      width: 100%;
      background: var(--dark-btn);
      color: #ffffff;
      border: none;
      border-radius: 18px;
      padding: 16px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 10px 20px -5px rgba(30, 41, 59, 0.2);
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .btn-action:hover {
      background-color: #0f172a;
    }

    .btn-action:active { 
      transform: scale(0.98); 
    }

    /* Results Stack */
    .cards-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .stat-card {
      border-radius: 24px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 8px 16px -4px rgba(0, 0, 0, 0.03);
    }

    .card-lime { background-color: var(--lime-card); }
    .card-pink { background-color: var(--pink-card); }
    .card-blue { background-color: var(--blue-card); }

    .card-tag {
      font-size: 0.75rem;
      font-weight: 800;
      color: #1e293b;
      text-transform: uppercase;
    }

    .card-output-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: #0f172a;
      line-height: 1.4;
    }
  </style>
</head>
<body>

<div class="app-shell">
  
  <div class="header-row">
    <div class="header-title-box">
      <div class="header-title">Edible Food & Animals</div>
      <div class="header-sub">Evaluates how people eat different food objects</div>
    </div>
    <div class="badge-pill">Edible App</div>
  </div>

  <!-- People Setup -->
  <div class="form-section">
    <div class="section-title">People Setup</div>
    <div class="input-field-box">
      <div class="input-label">Person 1 Name</div>
      <input type="text" id="person1" class="charmi-input" placeholder="Enter name (e.g. Ali)">
    </div>
